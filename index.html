      let currentTech = 'rust'; // Global state for current technology

      function applyLang(lang) {
        const dict = I18N[lang] || I18N.en;
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.dataset.i18n;
          if (dict[key]) el.innerHTML = dict[key];
        });

        // Update tech-specific content
        updateTechContent();

        localStorage.setItem('lang', lang);
        document.getElementById('langSelect').value = lang;
      }

      function updateTechContent() {
        const lang = document.documentElement.lang || 'en';
        const dict = I18N[lang] || I18N.en;

        // Update hero section
        const heroHeadBase = document.querySelector('[data-i18n-tech="hero_head_base"]');
        const heroSub = document.querySelector('[data-i18n-tech="hero_sub"]');
        const whyTitle = document.querySelector('[data-i18n-tech="why_title"]');
        const gasSavingsP = document.querySelector('[data-i18n-tech="gas_savings_p"]');
        const ecosystemH = document.querySelector('[data-i18n-tech="ecosystem_h"]');
        const ecosystemP = document.querySelector('[data-i18n-tech="ecosystem_p"]');
        const learnMoreH = document.querySelector('[data-i18n-tech="learn_more_h"]');
        const reposH = document.querySelector('[data-i18n-tech="repos_h"]');

        if (heroHeadBase) heroHeadBase.innerHTML = dict['hero_head_base'];
        if (heroSub) heroSub.innerHTML = dict[`hero_sub_${currentTech}`];
        if (whyTitle) whyTitle.innerHTML = dict[`why_title_${currentTech}`];
        if (gasSavingsP) gasSavingsP.innerHTML = dict[`gas_savings_p_${currentTech}`];
        if (ecosystemH) ecosystemH.innerHTML = dict[`ecosystem_h_${currentTech}`];
        if (ecosystemP) ecosystemP.innerHTML = dict[`ecosystem_p_${currentTech}`];
        if (learnMoreH) learnMoreH.innerHTML = dict[`learn_more_h_${currentTech}`];
        if (reposH) reposH.innerHTML = dict[`repos_h_${currentTech}`];

        // Update install command
        const installCmd = document.querySelector('.install-command');
        if (installCmd) {
          if (currentTech === 'rust') {
            installCmd.textContent = 'curl -s https://stylusup.sh/install.sh | sh';
          } else if (currentTech === 'typescript') {
            installCmd.textContent = 'npx @wakeuplabs/as-stylus generate stylus-hello-world';
          } else if (currentTech === 'move') {
            installCmd.textContent = 'coming soon :)';
          }
        }
      }

      function switchTech(tech) {
        currentTech = tech;

        // Update header toggle buttons
        const rustBtn = document.getElementById('rust-toggle');
        const typescriptBtn = document.getElementById('typescript-toggle');
        const moveBtn = document.getElementById('move-toggle');

        // Update hero toggle buttons
        const heroRustBtn = document.getElementById('hero-rust-toggle');
        const heroTypescriptBtn = document.getElementById('hero-typescript-toggle');
        const heroMoveBtn = document.getElementById('hero-move-toggle');

        // Reset all buttons to inactive state
        [rustBtn, typescriptBtn, moveBtn].forEach(btn => {
          if (btn) {
            btn.classList.remove('bg-indigo-600', 'bg-orange-600', 'bg-purple-600', 'text-white');
            btn.classList.add('bg-gray-200', 'text-gray-700');
          }
        });

        [heroRustBtn, heroTypescriptBtn, heroMoveBtn].forEach(btn => {
          if (btn) {
            btn.classList.remove('bg-indigo-600', 'bg-orange-600', 'bg-purple-600', 'text-white');
            btn.classList.add('bg-gray-200', 'text-gray-700');
          }
        });

        // Activate selected technology
        if (tech === 'rust') {
          rustBtn && rustBtn.classList.add('bg-indigo-600', 'text-white');
          rustBtn && rustBtn.classList.remove('bg-gray-200', 'text-gray-700');
          heroRustBtn && heroRustBtn.classList.add('bg-indigo-600', 'text-white');
          heroRustBtn && heroRustBtn.classList.remove('bg-gray-200', 'text-gray-700');
        } else if (tech === 'typescript') {
          typescriptBtn && typescriptBtn.classList.add('bg-orange-600', 'text-white');
          typescriptBtn && typescriptBtn.classList.remove('bg-gray-200', 'text-gray-700');
          heroTypescriptBtn && heroTypescriptBtn.classList.add('bg-orange-600', 'text-white');
          heroTypescriptBtn && heroTypescriptBtn.classList.remove('bg-gray-200', 'text-gray-700');
        } else if (tech === 'move') {
          moveBtn && moveBtn.classList.add('bg-purple-600', 'text-white');
          moveBtn && moveBtn.classList.remove('bg-gray-200', 'text-gray-700');
          heroMoveBtn && heroMoveBtn.classList.add('bg-purple-600', 'text-white');
          heroMoveBtn && heroMoveBtn.classList.remove('bg-gray-200', 'text-gray-700');
        }

        // Update content
        updateTechContent();

        // Save preference
        localStorage.setItem('selectedTech', tech);
      }

      window.addEventListener('DOMContentLoaded', () => {
        // Build language selector options dynamically from I18N keys
        const sel = document.getElementById('langSelect');
        Object.keys(I18N).forEach(k => {
          const opt = document.createElement('option');
          opt.value = k;
          opt.textContent = k.toUpperCase();
          sel.appendChild(opt);
        });
        sel.addEventListener('change', e => applyLang(e.target.value));

        // Setup tech toggle buttons (header)
        document.getElementById('rust-toggle').addEventListener('click', () => switchTech('rust'));
        document.getElementById('typescript-toggle').addEventListener('click', () => switchTech('typescript'));
        document.getElementById('move-toggle').addEventListener('click', () => switchTech('move'));

        // Setup tech toggle buttons (hero)
        document.getElementById('hero-rust-toggle').addEventListener('click', () => switchTech('rust'));
        document.getElementById('hero-typescript-toggle').addEventListener('click', () => switchTech('typescript'));
        document.getElementById('hero-move-toggle').addEventListener('click', () => switchTech('move'));

        // Load saved preferences
        const savedTech = localStorage.getItem('selectedTech') || 'rust';
        switchTech(savedTech);

        applyLang(localStorage.getItem('lang') || 'en');
      });
    </script>

        <div id="resources-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 text-left"></div>
      </div>

    <section id="stylus-projects" class="mb-20">
      <div class="max-w-6xl mx-auto px-4 text-center">
        <h2 class="text-3xl font-semibold mb-6" data-i18n-tech="repos_h"></h2>
        <p class="text-zinc-600 mb-12"></p>
        <div id="stylus-repos" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 text-left"></div>
      </div>
    </section>

    <script>
      const resources = {
        rust: [
          { title: "A Gentle Introduction to Stylus", desc: "A simple introduction to using Stylus, introducing core concepts.", url: "https://docs.arbitrum.io/stylus/gentle-introduction" },
          { title: "Amazing Stylus", desc: "Curated repositories of projects built using Stylus.", url: "https://github.com/OffchainLabs/awesome-stylus" },
          { title: "Rust For Smart Contracts", desc: "Simple WIP book introducing building Smart Contracts with Rust.", url: "https://rust-for-smart-contracts.com" },
          { title: "OpenZeppelin Wizard", desc: "Build ERC20, ERC721, and ERC1155 contracts VERY quickly.", url: "https://wizard.openzeppelin.com/stylus" }
        ],
        typescript: [
          { title: "Stylus TypeScript Guide", desc: "Complete guide to building smart contracts with TypeScript and Stylus.", url: "https://docs.arbitrum.io/stylus/typescript-guide" },
          { title: "TypeScript Smart Contract Templates", desc: "Ready-to-use TypeScript templates for common contract patterns.", url: "https://github.com/OffchainLabs/stylus-typescript-templates" },
          { title: "Stylus TypeScript SDK", desc: "TypeScript SDK and utilities for Stylus development.", url: "https://www.npmjs.com/package/@stylus/typescript-sdk" },
          { title: "Migration Guide: Solidity to TypeScript", desc: "Step-by-step guide for migrating from Solidity to Stylus TypeScript.", url: "https://docs.arbitrum.io/stylus/migration-guide" }
        ],
        move: [
          { title: "Stylus Move Integration Guide", desc: "Learn how to use Move programming language with Stylus on Arbitrum.", url: "https://docs.arbitrum.io/stylus/move-guide" },
          { title: "Move Language Documentation", desc: "Official Move programming language documentation and tutorials.", url: "https://move-language.github.io/move/" },
          { title: "Move Smart Contract Examples", desc: "Collection of Move smart contract examples for Stylus.", url: "https://github.com/OffchainLabs/stylus-move-examples" },
          { title: "Move to Solidity Migration", desc: "Guide for developers moving from Solidity to Move on Stylus.", url: "https://docs.arbitrum.io/stylus/move-migration" }
        ]
      };

      function updateResources() {
        const resContainer = document.getElementById("resources-grid");
        resContainer.innerHTML = '';

        const currentResources = resources[currentTech] || resources.rust;
        currentResources.forEach(r => {
          const card = document.createElement("a");
          card.href = r.url;
          card.target = "_blank";
          card.rel = "noopener";
          card.className = "p-6 bg-white rounded-2xl shadow-sm hover:shadow-md transition block";
          card.innerHTML = `<h3 class="font-medium mb-1">${r.title}</h3><p class="text-zinc-600 mb-3">${r.desc}</p><span class="text-indigo-600 font-medium">Read more →</span>`;
          resContainer.appendChild(card);
        });
      }

      (async () => {
        try {
          const searchQuery = currentTech === 'typescript'
            ? "topic:stylus+topic:typescript+topic:arbitrum"
            : currentTech === 'move'
            ? "topic:stylus+topic:move+topic:arbitrum"
            : "topic:stylus+topic:arbitrum";

          const res = await fetch(`https://api.github.com/search/repositories?q=${searchQuery}&sort=stars&order=desc&per_page=35`);
          const { items } = await res.json();
          const container = document.getElementById("stylus-repos");
          const existing = new Set(Array.from(container.children).map(card => card.querySelector("h3")?.textContent?.trim() || ''));

          container.innerHTML = ''; // Clear existing content

          for (const repo of items) {
            if (container.children.length >= 10) break; // max 10 cards
            if (existing.has(repo.name)) continue; // skip curated

            // Filter based on current tech selection
            const repoTopics = repo.topics || [];
            const isRelevant = currentTech === 'typescript'
              ? repoTopics.includes('typescript') || repo.language === 'TypeScript'
              : currentTech === 'move'
              ? repoTopics.includes('move') || repo.language === 'Move'
              : repoTopics.includes('rust') || repo.language === 'Rust' || (!repoTopics.includes('typescript') && !repoTopics.includes('move'));

            if (!isRelevant) continue;

            const card = document.createElement("a");
            card.href = repo.html_url;
            card.target = "_blank";
            card.rel = "noopener";
            card.className = "p-6 bg-white rounded-2xl shadow-sm hover:shadow-md transition flex flex-col";
            card.innerHTML = `<h3 class="font-medium mb-1">${repo.name}</h3><p class="text-zinc-600 mb-3">${repo.description || ""}</p><span class="text-indigo-600 font-medium mt-auto">View →</span>`;
            container.appendChild(card);
          }
        } catch (err) {
          console.error("GitHub fetch failed", err);
        }
      });

      // Override the original switchTech function to update resources
      const originalSwitchTech = switchTech;
      switchTech = function(tech) {
        originalSwitchTech(tech);
        updateResources();
        // Re-fetch repos for the new tech selection
        setTimeout(() => {
          (async () => {
            try {
              const searchQuery = tech === 'typescript'
                ? "topic:stylus+topic:typescript+topic:arbitrum"
                : "topic:stylus+topic:arbitrum";

              const res = await fetch(`https://api.github.com/search/repositories?q=${searchQuery}&sort=stars&order=desc&per_page=35`);
              const { items } = await res.json();
              const container = document.getElementById("stylus-repos");

              container.innerHTML = ''; // Clear existing content

              for (const repo of items) {
                if (container.children.length >= 10) break;

                const repoTopics = repo.topics || [];
                const isRelevant = tech === 'typescript'
                  ? repoTopics.includes('typescript') || repo.language === 'TypeScript'
                  : repoTopics.includes('rust') || repo.language === 'Rust' || !repoTopics.includes('typescript');

                if (!isRelevant) continue;

                const card = document.createElement("a");
                card.href = repo.html_url;
                card.target = "_blank";
                card.rel = "noopener";
                card.className = "p-6 bg-white rounded-2xl shadow-sm hover:shadow-md transition flex flex-col";
                card.innerHTML = `<h3 class="font-medium mb-1">${repo.name}</h3><p class="text-zinc-600 mb-3">${repo.description || ""}</p><span class="text-indigo-600 font-medium mt-auto">View →</span>`;
                container.appendChild(card);
              }
            } catch (err) {
              console.error("GitHub fetch failed", err);
            }
          })();
        }, 100);
      };

      const initPosthog = () => {
          posthog.init("phc_4JuhKBNqffUmqFa8ATKZQ95L13feFWl4CaAGvpCmXl6", {
              api_host: "https://us.i.posthog.com",
              person_profiles: "always",
          });
      };

      document.addEventListener('DOMContentLoaded', () => {
        const banner = document.getElementById("cookie-banner");
        const btn = document.getElementById("cookie-accept");
        if (localStorage.getItem("cookieAccepted") === "1") {
          banner.style.display="none";
          initPosthog();
        }
        btn && btn.addEventListener("click", ()=>{
          banner.style.display = "none";
          localStorage.setItem("cookieAccepted", "1");
          initPosthog();
        });

        // Initialize resources on page load
        updateResources();
      });
    </script>

      <span>This site uses cookies and collects usage info. See our <a href="/privacy.txt" target="_blank" class="underline font-medium text-indigo-300">privacy policy</a>.</span>

    </div>
